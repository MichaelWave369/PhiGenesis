name: Absent Architect E2
on: [push, pull_request]
permissions:
  contents: read
jobs:
  e2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/absent-architect-e2.mjs test
      - run: |
          node experiments/absent-architect-e2.mjs report 90 > /tmp/e2-first.json
          node experiments/absent-architect-e2.mjs report 90 > /tmp/e2-second.json
          cmp /tmp/e2-first.json /tmp/e2-second.json
