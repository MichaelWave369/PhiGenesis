name: Absent Architect E3.0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  e30:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/absent-architect-e30.mjs test
      - run: |
          node experiments/absent-architect-e30.mjs report 90 > /tmp/e30-first.json
          node experiments/absent-architect-e30.mjs report 90 > /tmp/e30-second.json
          cmp /tmp/e30-first.json /tmp/e30-second.json
