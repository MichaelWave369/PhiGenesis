name: Phi024 evolutionary integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phi024:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/phi024-integrity-test.mjs
