name: Phi021 collaborative evolution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phi021:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/phi021-collaborative-evolution.mjs test
      - run: |
          node experiments/phi021-collaborative-evolution.mjs report 90 > /tmp/phi021-a.json
          node experiments/phi021-collaborative-evolution.mjs report 90 > /tmp/phi021-b.json
          cmp /tmp/phi021-a.json /tmp/phi021-b.json
