name: Genesis Field v0.3
on: [push, pull_request]
permissions:
  contents: read
jobs:
  peer-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node runtime/cli-v03.mjs test
      - name: Compare seeded benchmark records
        run: |
          node runtime/cli-v03.mjs report > "$RUNNER_TEMP/v03-report.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.deepEqual(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/v03-report.json")),JSON.parse(fs.readFileSync("results/genesis_field_v03.json")))'
