name: Genesis Field v1.0 RC1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node runtime/cli-v10-rc1.mjs test
      - name: Compare benchmark
        run: |
          node runtime/cli-v10-rc1.mjs summary > "$RUNNER_TEMP/rc1-report.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.deepEqual(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/rc1-report.json")),JSON.parse(fs.readFileSync("results/genesis_field_v10_rc1.json")))'
      - name: Authenticated cross-process abort and continuation
        run: |
          export PHIGENESIS_CHECKPOINT_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          p="$RUNNER_TEMP/rc1.json"
          node runtime/cli-v10-rc1.mjs init "$p" 12345 cold
          node runtime/cli-v10-rc1.mjs step "$p" 5
          node runtime/cli-v10-rc1.mjs step "$p" 192
          node runtime/cli-v10-rc1.mjs inspect "$p" > "$RUNNER_TEMP/rc1-state.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/rc1-state.json")); assert.equal(s.events.length,2); assert.equal(s.events[0].status,"aborted"); assert.equal(s.events[0].cost.total,5); assert.equal(s.events[1].status,"accepted"); assert.equal(s.events[1].relation.classification,"certified"); assert.equal(Object.keys(s.relations).length,1)'
      - name: Preserve release gate
        run: |
          set +e
          node runtime/cli-v10-rc1.mjs gate > "$RUNNER_TEMP/rc1-gate.json"
          status=$?
          set -e
          test "$status" -eq 1
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/rc1-gate.json")); assert.equal(s.releaseReady,false); assert.equal(s.scopedChecksPassed,true);'
