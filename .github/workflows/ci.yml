name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/phi_genesis_005.py --seeds 3
      - run: python experiments/phi_genesis_006.py --seeds 3 --steps 200
      - run: python experiments/phi_genesis_010.py --seeds 90
      - run: python experiments/phi_genesis_011.py --seeds 90
