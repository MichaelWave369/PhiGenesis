name: Absent Architect E2.4
on: [push, pull_request]
permissions:
  contents: read
jobs:
  e24:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/absent-architect-e24.mjs test
      - run: |
          node experiments/absent-architect-e24.mjs report 90 > /tmp/e24-first.json
          node experiments/absent-architect-e24.mjs report 90 > /tmp/e24-second.json
          cmp /tmp/e24-first.json /tmp/e24-second.json
