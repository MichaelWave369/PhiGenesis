name: Genesis Field v0.6
on: [push, pull_request]
permissions:
  contents: read
jobs:
  temporal-relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node runtime/cli-v06.mjs test
      - name: Reproduce full seeded report
        run: |
          node runtime/cli-v06.mjs summary > "$RUNNER_TEMP/v06-report.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.deepEqual(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/v06-report.json")),JSON.parse(fs.readFileSync("results/genesis_field_v06.json")))'
      - name: Cross-process restart
        run: |
          p="$RUNNER_TEMP/v06.json"
          node runtime/cli-v06.mjs init "$p" 12345 combined
          node runtime/cli-v06.mjs step "$p"
          node runtime/cli-v06.mjs step "$p"
          node runtime/cli-v06.mjs step "$p"
          node runtime/cli-v06.mjs inspect "$p" > "$RUNNER_TEMP/v06-state.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; import {create,select,observe,world,peerAPI,previous} from "./runtime/field-v06.mjs"; const s=create(12345,"combined"); for(let i=0;i<3;i++){const p=select(s);observe(s,previous.execute(peerAPI,world(s.seed,i,"abrupt"),p.method));} assert.deepEqual(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/v06-state.json")),s);'
