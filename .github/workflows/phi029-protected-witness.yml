name: Phi029 protected witness authority
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phi029:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/phi029-quorum-test.mjs
