name: Absent Architect E0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  e0:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/absent-architect-e0.mjs test
      - run: |
          node experiments/absent-architect-e0.mjs report 90 > /tmp/e0-first.json
          node experiments/absent-architect-e0.mjs report 90 > /tmp/e0-second.json
          cmp /tmp/e0-first.json /tmp/e0-second.json
