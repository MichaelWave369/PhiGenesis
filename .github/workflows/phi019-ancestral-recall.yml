name: Phi019 ancestral recall
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phi019:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/phi019-ancestral-recall.mjs test
      - run: |
          node experiments/phi019-ancestral-recall.mjs report 90 > /tmp/phi019-a.json
          node experiments/phi019-ancestral-recall.mjs report 90 > /tmp/phi019-b.json
          cmp /tmp/phi019-a.json /tmp/phi019-b.json
